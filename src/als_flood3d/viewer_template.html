<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel-2: #1f242c; --line: #2b313b;
    --text: #e6e9ee; --muted: #9aa3af; --accent: #4f9cf9; --accent-ink: #0b1a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #panel { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  #view { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 8px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .seg button, .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 8px; font: inherit; cursor: pointer; text-align: left; }
  .seg button:hover, .btn:hover { border-color: #3a4250; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { flex: none; width: 100px; color: var(--muted); }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .row output { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 4px; margin-top: 6px; }
  .chips .btn { padding: 3px 8px; font-size: 12px; }
  .ctl { display: flex; flex-direction: column; gap: 8px; }
  .hidden { display: none !important; }
  .classes label { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .classes .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #legend canvas { width: 100%; height: 12px; border-radius: 3px; }
  #legend .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums; }
  #legend .cap { margin-bottom: 6px; }
  #legend .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .views { display: flex; gap: 4px; }
  .views .btn { flex: 1; text-align: center; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  #pick { position: absolute; right: 12px; top: 12px; background: rgba(23,27,33,.92);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 180px; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 11px;
    background: rgba(15,18,22,.7); padding: 4px 8px; border-radius: 4px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  #toggle { display: none; }
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #panel { width: 100%; max-height: 45%; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    #panel.collapsed > :not(header) { display: none; }
    #toggle { display: inline-block; float: right; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <button id="toggle" class="btn">Panel</button>
      <h1 id="title"></h1>
      <div class="sub" id="stats"></div>
    </header>

    <section>
      <h2>Color</h2>
      <div class="seg" id="modes">
        <button data-mode="acu">Acumulación</button>
        <button data-mode="run">Escorrentía</button>
        <button data-mode="rgb">Color real</button>
        <button data-mode="cls">Clasificación</button>
        <button data-mode="z">Altura</button>
      </div>
    </section>

    <section class="ctl" id="ctl-acu">
      <h2>Acumulación (ACU)</h2>
      <div class="row"><label for="acuCap">Profundidad</label>
        <input id="acuCap" type="range" min="0.5" max="20" step="0.5" value="10"><output id="acuCapV"></output></div>
      <div class="chips"><button class="btn" data-cap="2">2 m · lluvia extrema</button><button class="btn" data-cap="10">10 m · paper</button></div>
    </section>

    <section class="ctl hidden" id="ctl-run">
      <h2>Escorrentía (RUN)</h2>
      <div class="row"><label for="runMin">Mínimo</label>
        <input id="runMin" type="range" min="0" max="1" step="0.01"><output id="runMinV"></output></div>
      <div class="row"><label for="runMax">Máximo</label>
        <input id="runMax" type="range" min="0" max="1" step="0.01"><output id="runMaxV"></output></div>
    </section>

    <section id="legend"></section>

    <section>
      <h2>Clases visibles</h2>
      <div class="classes" id="classes"></div>
    </section>

    <section class="ctl">
      <h2>Vista</h2>
      <div class="row"><label for="size">Tamaño punto</label>
        <input id="size" type="range" min="0.1" max="4" step="0.1"><output id="sizeV"></output></div>
      <div class="views"><button class="btn" id="top">Cenital</button><button class="btn" id="persp">Perspectiva</button></div>
    </section>

    <section>
      <h2>Parámetros</h2>
      <dl id="info"></dl>
    </section>
  </aside>

  <main id="view">
    <div id="loading">Cargando nube de puntos…</div>
    <div id="pick" class="hidden"></div>
    <div id="hint">Arrastrar: orbitar · Botón derecho: desplazar · Rueda: zoom · Clic: inspeccionar punto</div>
  </main>
</div>

<script id="meta" type="application/json">__META__</script>
<script id="data" type="application/octet-stream">__DATA__</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const META = JSON.parse(document.getElementById('meta').textContent);
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat('es-ES');

// ---------- data ----------
const b64 = document.getElementById('data').textContent.trim();
const buf = await (await fetch('data:application/octet-stream;base64,' + b64)).arrayBuffer();
document.getElementById('data').remove();
const n = META.n;
const posQ = new Uint16Array(buf, 0, n * 3);
const acuQ = new Uint16Array(buf, n * 6, n);
const rgb  = new Uint8Array(buf, n * 8, n * 3);
const cls  = new Uint8Array(buf, n * 11, n);
const runQ = new Uint8Array(buf, n * 12, n);

const lo = META.min, hi = META.max;
const center = lo.map((v, i) => (v + hi[i]) / 2);
const span = lo.map((v, i) => hi[i] - v);
const pos = new Float32Array(n * 3);
for (let i = 0; i < n; i++) {
  for (let k = 0; k < 3; k++) pos[i*3+k] = posQ[i*3+k] / 65535 * span[k] + lo[k] - center[k];
}
const acuAt = (i) => acuQ[i] === 65535 ? NaN : acuQ[i] / 100;
const runAt = (i) => runQ[i] === 255 ? NaN : runQ[i] / 254;

// ---------- colour ramps ----------
function lut(stops) {
  const c = stops.map(h => [1, 3, 5].map(j => parseInt(h.slice(j, j + 2), 16)));
  const out = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (c.length - 1), a = Math.min(Math.floor(t), c.length - 2), f = t - a;
    for (let k = 0; k < 3; k++) out[i*3+k] = Math.round(c[a][k] + (c[a+1][k] - c[a][k]) * f);
  }
  return out;
}
const RAMPS = {
  acu: lut(['#d6e6f2', '#9ecae1', '#4292c6', '#1561a8', '#08306b']),
  run: lut(['#000004', '#420a68', '#932667', '#dd513a', '#fca50a', '#fcffa4']),
  z:   lut(['#440154', '#3b528b', '#21918c', '#5ec962', '#fde725']),
};
const CLASSES = {
  0: ['Sin clase', '#9e9e9e'], 1: ['Sin clasificar', '#9e9e9e'], 2: ['Suelo', '#b08968'],
  3: ['Vegetación baja', '#c5e1a5'], 4: ['Vegetación media', '#7cb342'], 5: ['Vegetación alta', '#2e7d32'],
  6: ['Edificio', '#e57373'], 7: ['Ruido', '#616161'], 9: ['Agua', '#4fc3f7'], 17: ['Puente', '#ffb74d'],
};
const hex = (h) => [1, 3, 5].map(j => parseInt(h.slice(j, j + 2), 16));
const classInfo = (c) => CLASSES[c] || [`Clase ${c}`, '#bdbdbd'];

// ---------- state ----------
// Default point size ~ spacing of the displayed sample, so surfaces look closed.
const spacing = Math.sqrt((META.max[0] - META.min[0]) * (META.max[1] - META.min[1]) / META.n);
const state = {
  mode: 'acu', acuCap: 10, size: +Math.min(Math.max(spacing * 1.3, 0.2), 4).toFixed(1),
  runMin: +META.runRange[0].toFixed(2), runMax: +META.runRange[1].toFixed(2),
  hidden: new Set([7]),
};

// ---------- three.js ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // vertex colours are already display sRGB
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1216);
const extent = Math.max(span[0], span[1]);
const camera = new THREE.PerspectiveCamera(50, 1, extent / 5000, extent * 20);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.screenSpacePanning = true;

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const colors = new Uint8Array(n * 3);
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3, true));
geom.computeBoundingSphere();
const material = new THREE.PointsMaterial({ size: state.size, vertexColors: true, sizeAttenuation: true });
const points = new THREE.Points(geom, material);
scene.add(points);

const marker = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
marker.visible = false;
scene.add(marker);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

function setView(kind) {
  controls.target.set(0, 0, 0);
  if (kind === 'top') camera.position.set(0, -0.001, extent * 1.1);
  else camera.position.set(-extent * 0.45, -extent * 0.75, extent * 0.55);
  controls.update();
}

// ---------- colouring ----------
function recolor() {
  const { mode } = state;
  if (mode === 'acu') {
    const cap = state.acuCap, L = RAMPS.acu;
    for (let i = 0; i < n; i++) {
      const a = acuAt(i), o = i * 3;
      if (a < cap) {
        const j = Math.round((1 - a / cap) * 255) * 3;
        colors[o] = L[j]; colors[o+1] = L[j+1]; colors[o+2] = L[j+2];
      } else {
        // Context: points above the displayed depth in muted greys (photo luminance if available).
        let g = META.hasRgb ? (0.3 * rgb[o] + 0.59 * rgb[o+1] + 0.11 * rgb[o+2]) * 0.55 + 40 : 120;
        if (Number.isNaN(a)) g = 60;
        colors[o] = colors[o+1] = colors[o+2] = g;
      }
    }
  } else if (mode === 'run') {
    const L = RAMPS.run, lo_ = state.runMin, d = Math.max(state.runMax - state.runMin, 1e-6);
    for (let i = 0; i < n; i++) {
      const r = runAt(i), o = i * 3;
      if (Number.isNaN(r)) { colors[o] = colors[o+1] = colors[o+2] = 60; continue; }
      const j = Math.round(Math.min(Math.max((r - lo_) / d, 0), 1) * 255) * 3;
      colors[o] = L[j]; colors[o+1] = L[j+1]; colors[o+2] = L[j+2];
    }
  } else if (mode === 'rgb') {
    colors.set(rgb);
  } else if (mode === 'cls') {
    const cache = {};
    for (let i = 0; i < n; i++) {
      const c = cache[cls[i]] ||= hex(classInfo(cls[i])[1]);
      colors.set(c, i * 3);
    }
  } else if (mode === 'z') {
    const L = RAMPS.z;
    for (let i = 0; i < n; i++) {
      const j = Math.round(posQ[i*3+2] / 65535 * 255) * 3;
      colors[i*3] = L[j]; colors[i*3+1] = L[j+1]; colors[i*3+2] = L[j+2];
    }
  }
  geom.attributes.color.needsUpdate = true;
  drawLegend();
}

function refilter() {
  let m = 0;
  const idx = new Uint32Array(n);
  for (let i = 0; i < n; i++) if (!state.hidden.has(cls[i])) idx[m++] = i;
  geom.setIndex(new THREE.BufferAttribute(idx.subarray(0, m), 1));
  $('stats').textContent = `${fmt.format(m)} puntos visibles · ${fmt.format(META.nTotal)} en la nube`;
}

// ---------- legend ----------
function rampLegend(L, caption, left, right, note) {
  const el = $('legend');
  el.innerHTML = `<h2>Leyenda</h2><div class="cap">${caption}</div><canvas width="256" height="1"></canvas>
    <div class="ticks"><span>${left}</span><span>${right}</span></div>${note ? `<div class="note">${note}</div>` : ''}`;
  const ctx = el.querySelector('canvas').getContext('2d');
  const img = ctx.createImageData(256, 1);
  for (let i = 0; i < 256; i++) { img.data.set([L[i*3], L[i*3+1], L[i*3+2], 255], i * 4); }
  ctx.putImageData(img, 0, 0);
}
function drawLegend() {
  const el = $('legend');
  if (state.mode === 'acu') {
    // Flip the ramp so the bar reads 0 m (left, darkest) -> cap (right, lightest).
    const L = RAMPS.acu, F = new Uint8Array(768);
    for (let i = 0; i < 256; i++) F.set(L.subarray((255 - i) * 3, (255 - i) * 3 + 3), i * 3);
    rampLegend(F, 'Altura sobre el mínimo local del terreno (r1)', '0 m · acumula', `${state.acuCap} m`,
      'Gris: por encima de la profundidad mostrada (zona segura).');
  } else if (state.mode === 'run') {
    rampLegend(RAMPS.run, 'Potencial de escorrentía', state.runMin.toFixed(2), state.runMax.toFixed(2),
      'Alto: superficies inclinadas, continuas y sin vegetación.');
  } else if (state.mode === 'z') {
    rampLegend(RAMPS.z, 'Cota (m)', lo[2].toFixed(1), hi[2].toFixed(1));
  } else if (state.mode === 'cls') {
    el.innerHTML = '<h2>Leyenda</h2><div class="sub">Colores en la lista de clases.</div>';
  } else {
    el.innerHTML = META.hasRgb ? '' : '<h2>Leyenda</h2><div class="sub">La nube no tiene RGB.</div>';
  }
}

// ---------- UI ----------
$('title').textContent = META.title;
const info = { ...META.info, 'Mostrados': `${fmt.format(n)} (muestra aleatoria)` };
{ const dl = $('info'); dl.replaceChildren();
  for (const [k, v] of Object.entries(info)) {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.append(dt, dd); } }

const counts = {};
for (let i = 0; i < n; i++) counts[cls[i]] = (counts[cls[i]] || 0) + 1;
$('classes').innerHTML = Object.keys(counts).map(Number).sort((a, b) => a - b).map(c => {
  const [name, col] = classInfo(c);
  return `<label><input type="checkbox" data-cls="${c}" ${state.hidden.has(c) ? '' : 'checked'}>
    <span class="sw" style="background:${col}"></span>${c} · ${name}<span class="n">${fmt.format(counts[c])}</span></label>`;
}).join('');
$('classes').addEventListener('change', (e) => {
  const c = +e.target.dataset.cls;
  e.target.checked ? state.hidden.delete(c) : state.hidden.add(c);
  refilter();
});

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('ctl-acu').classList.toggle('hidden', mode !== 'acu');
  $('ctl-run').classList.toggle('hidden', mode !== 'run');
  recolor();
}
$('modes').addEventListener('click', (e) => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); });
if (!META.hasRgb) document.querySelector('[data-mode=rgb]').disabled = true;

function bindRange(id, key, unit, digits, onChange) {
  const el = $(id), out = $(id + 'V');
  el.value = state[key];
  const show = () => { out.textContent = (+state[key]).toFixed(digits) + unit; };
  el.addEventListener('input', () => { state[key] = +el.value; show(); onChange(); });
  show();
  return (v) => { state[key] = v; el.value = v; show(); onChange(); };
}
const setCap = bindRange('acuCap', 'acuCap', ' m', 1, recolor);
document.querySelectorAll('[data-cap]').forEach(b => b.addEventListener('click', () => setCap(+b.dataset.cap)));
bindRange('runMin', 'runMin', '', 2, recolor);
bindRange('runMax', 'runMax', '', 2, recolor);
bindRange('size', 'size', ' m', 1, () => { material.size = state.size; });

$('top').addEventListener('click', () => setView('top'));
$('persp').addEventListener('click', () => setView('persp'));
$('toggle').addEventListener('click', () => $('panel').classList.toggle('collapsed'));

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  raycaster.params.Points.threshold = camera.position.distanceTo(controls.target) / 400;
  const hit = raycaster.intersectObject(points)[0];
  const box = $('pick');
  if (!hit) { box.classList.add('hidden'); marker.visible = false; return; }
  const i = hit.index, a = acuAt(i), ru = runAt(i);
  marker.position.copy(hit.point);
  marker.scale.setScalar(raycaster.params.Points.threshold * 0.6);
  marker.visible = true;
  const x = pos[i*3] + center[0], y = pos[i*3+1] + center[1], z = pos[i*3+2] + center[2];
  box.innerHTML = `<h2>Punto</h2><dl>
    <dt>X, Y</dt><dd>${x.toFixed(1)}, ${y.toFixed(1)}</dd><dt>Z</dt><dd>${z.toFixed(2)} m</dd>
    <dt>Clase</dt><dd>${cls[i]} · ${classInfo(cls[i])[0]}</dd>
    <dt>ACU</dt><dd>${Number.isNaN(a) ? '—' : a.toFixed(2) + ' m'}</dd>
    <dt>RUN</dt><dd>${Number.isNaN(ru) ? '—' : ru.toFixed(3)}</dd></dl>`;
  box.classList.remove('hidden');
});

// ---------- go ----------
resize();
refilter();
setMode('acu');
setView('persp');
$('loading').remove();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
